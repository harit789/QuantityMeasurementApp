# Application Name
spring.application.name=quantity-measurement-app

# ─── MySQL Database Configuration ───────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/quantitymeasurementdb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=Harit@789

# ─── JPA Configuration ──────────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ─── REMOVE the H2 console lines entirely ───────────────────────────────────
# spring.h2.console.enabled=true     ← DELETE
# spring.h2.console.path=/h2-console ← DELETE

# Actuator
management.endpoints.web.exposure.include=health,info


# Google OAuth2 Configuration
# Add your actual credentials in .env file locally
# Never commit real credentials here!
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.redirect-uri=${APP_URL}/login/oauth2/code/google